name: Package retention
run-name: Package retention (texcel-api, texcel-web)

on:
    schedule:
        # every day at 03:00 Asia/Bangkok (20:00 UTC)
        - cron: '0 20 * * *'
    workflow_dispatch:
        inputs:
            dry-run:
                description: Only log what would be deleted
                type: boolean
                default: true

jobs:
    cleanup:
        runs-on: ubuntu-latest
        steps:
            # Deletes GHCR image versions older than 1 month.
            # - `latest` and `UAT` are never deleted, so the running environments stay pullable.
            # - Untagged child manifests (per-arch digests) of a kept multi-arch image are kept too.
            - name: 🧹 Delete container images older than 1 month
              uses: snok/container-retention-policy@v3.0.0
              with:
                  # repo owner is a personal account, not an org
                  account: user
                  token: ${{ secrets.PACKAGES_PAT }}
                  image-names: |
                      ${{ github.event.repository.name }}
                  image-tags: '!latest, !UAT'
                  tag-selection: both
                  cut-off: 4w
                  timestamp-to-use: updated_at
                  dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || false }}
